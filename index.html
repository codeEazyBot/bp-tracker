<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f766e">
<title>BP Logger</title>
<style>
  :root { --c:#0f766e; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; max-width: 480px; margin-inline: auto; background:#f4f7f6; color:#12211f; }
  h1 { font-size: 1.3rem; margin: 0 0 12px; }
  .card { background:#fff; border-radius:14px; padding:16px; margin-bottom:14px; box-shadow:0 1px 4px #0001; }
  button, .btn { width:100%; padding:16px; font-size:1.1rem; border:0; border-radius:12px; background:var(--c); color:#fff; font-weight:600; display:block; text-align:center; }
  button.alt { background:#e2ece9; color:var(--c); }
  button:disabled { opacity:.5; }
  .row { display:flex; gap:10px; }
  .row > div { flex:1; }
  label { font-size:.8rem; color:#52645f; display:block; margin-bottom:4px; }
  input[type=number], input[type=time] { width:100%; font-size:1.6rem; padding:10px; border:2px solid #cfdcd8; border-radius:10px; text-align:center; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .chips button { width:auto; flex:1; padding:12px; font-size:.95rem; }
  #preview { width:100%; border-radius:10px; margin-bottom:10px; display:none; }
  #msg { text-align:center; min-height:1.4em; font-weight:600; }
  .hidden { display:none; }
</style>
</head>
<body>
<h1>🩺 BP Logger</h1>

<div class="card">
  <img id="preview" alt="Captured photo">
  <label class="btn" for="cam">📷 Scan BP monitor</label>
  <input id="cam" type="file" accept="image/*" capture="environment" hidden>
</div>

<div id="confirm" class="card hidden">
  <p style="margin-top:0"><b>Check the reading</b> – correct it if wrong:</p>
  <div class="row">
    <div><label>Systolic</label><input id="sys" type="number" inputmode="numeric"></div>
    <div><label>Diastolic</label><input id="dia" type="number" inputmode="numeric"></div>
    <div><label>Pulse</label><input id="pul" type="number" inputmode="numeric"></div>
  </div>

  <p><b>Tablet taken at</b></p>
  <input id="tab" type="time">
  <div class="chips">
    <button class="alt" id="now">Just now</button>
    <button class="alt" id="m30">30 min ago</button>
    <button class="alt" id="h1">1 hr ago</button>
    <button class="alt" id="none">Not taken</button>
  </div>

  <button id="save" style="margin-top:16px">✅ Looks right – Save</button>
  <button class="alt" id="retake" style="margin-top:10px">Retake photo</button>
</div>

<div id="msg"></div>

<script>
// >>> PASTE YOUR APPS SCRIPT WEB APP URL HERE <<<
const API = 'https://script.google.com/macros/s/AKfycbw47VKmQCFuap_3Lu8nwRt_utrtr_nrfkLnBheHChYSpJnYy68F5IV700Hn-8P-zNFenA/exec';

const $ = id => document.getElementById(id);
let tabletNone = false;

function hhmm(d) { return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
function setTablet(minAgo) { tabletNone = false; $('tab').value = hhmm(new Date(Date.now() - minAgo*60000)); }
$('now').onclick = () => setTablet(0);
$('m30').onclick = () => setTablet(30);
$('h1').onclick  = () => setTablet(60);
$('none').onclick = () => { tabletNone = true; $('tab').value = ''; };
$('tab').oninput = () => tabletNone = false;

async function post(body) {
  const r = await fetch(API, { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(body) });
  return r.json();
}

// Shrink photo so upload is fast
function toJpegBase64(file, maxW = 1280) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, maxW / img.width);
      const c = document.createElement('canvas');
      c.width = img.width * s; c.height = img.height * s;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const url = c.toDataURL('image/jpeg', 0.85);
      res({ url, b64: url.split(',')[1] });
    };
    img.src = URL.createObjectURL(file);
  });
}

$('cam').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  $('msg').textContent = 'Reading display…';
  $('confirm').classList.add('hidden');
  const { url, b64 } = await toJpegBase64(f);
  $('preview').src = url; $('preview').style.display = 'block';
  try {
    const r = await post({ action:'read', image:b64 });
    if (r.error) throw new Error(r.error);
    $('sys').value = r.systolic ?? ''; $('dia').value = r.diastolic ?? ''; $('pul').value = r.pulse ?? '';
    setTablet(0);
    $('confirm').classList.remove('hidden');
    $('msg').textContent = (r.systolic && r.diastolic) ? '' : '⚠️ Could not read all values – please type them in.';
  } catch (err) { $('msg').textContent = '❌ ' + err.message; }
  e.target.value = '';
};

$('retake').onclick = () => $('cam').click();

$('save').onclick = async () => {
  if (!$('sys').value || !$('dia').value) { $('msg').textContent = 'Enter systolic and diastolic.'; return; }
  $('save').disabled = true; $('msg').textContent = 'Saving…';
  try {
    const r = await post({ action:'save', systolic:+$('sys').value, diastolic:+$('dia').value,
      pulse:+$('pul').value || '', tablet: tabletNone ? 'Not taken' : $('tab').value });
    if (r.error) throw new Error(r.error);
    $('msg').textContent = '✅ Saved to sheet';
    $('confirm').classList.add('hidden'); $('preview').style.display = 'none';
  } catch (err) { $('msg').textContent = '❌ ' + err.message; }
  $('save').disabled = false;
};
</script>
</body>
</html>
