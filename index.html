<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BP & Medication Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      width: 100vw;
    }
    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    /* Viewfinder */
    .camera-wrapper {
      position: relative;
      width: 100%;
      height: 230px;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .overlay-frame {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      height: 65%;
      border: 2px dashed #38bdf8;
      border-radius: 10px;
      pointer-events: none;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 4px;
      background: rgba(56, 189, 248, 0.04);
    }
    .overlay-frame span {
      font-size: 11px;
      color: #38bdf8;
      background: rgba(0,0,0,0.7);
      padding: 2px 6px;
      border-radius: 4px;
    }
    
    /* Buttons */
    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      transition: opacity 0.2s;
    }
    button:active { opacity: 0.8; }
    .btn-secondary { background: #334155; color: #f8fafc; padding: 12px; width: 100%; }
    .btn-primary { background: #059669; color: #fff; padding: 13px; width: 100%; font-size: 15px; }
    .btn-pill { background: #0284c7; color: #fff; padding: 6px 12px; border-radius: 20px; font-size: 12px; }

    /* Cards */
    .card {
      background: #1e293b;
      padding: 14px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }
    .row-between { display: flex; justify-content: space-between; align-items: center; }
    .label { font-size: 11px; color: #94a3b8; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }
    
    /* Fully responsive, non-overflowing inputs */
    .inputs-grid {
      display: flex;
      gap: 8px;
      width: 100%;
    }
    .input-box {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .input-box label {
      font-size: 10px;
      color: #94a3b8;
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
    }
    .input-box input {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #38bdf8;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      padding: 8px 4px;
    }
    .input-box input:focus { border-color: #38bdf8; outline: none; }
    
    .status-text {
      font-size: 12px;
      text-align: center;
      color: #e2e8f0;
      line-height: 1.4;
      padding: 0 4px;
    }
    .debug-text {
      font-size: 10px;
      color: #64748b;
      word-break: break-all;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Camera Viewfinder -->
  <div class="camera-wrapper">
    <video id="video" playsinline autoplay muted></video>
    <div class="overlay-frame"><span>Fit BP display inside box</span></div>
  </div>

  <button class="btn-secondary" id="scanBtn" onclick="captureAndOCR()">📸 Scan Reading</button>
  <div class="status-text" id="statusMessage">Camera ready. Align numbers inside the box & tap Scan.</div>

  <!-- Validated Inputs -->
  <div class="card">
    <div class="row-between">
      <span class="label">Reading (Tap to edit)</span>
      <span id="ocrBadge" style="font-size:11px; color:#10b981; display:none;">✓ Numbers Found</span>
    </div>

    <div class="inputs-grid">
      <div class="input-box">
        <label>SYS</label>
        <input type="number" id="sysInput" placeholder="--">
      </div>
      <div class="input-box">
        <label>DIA</label>
        <input type="number" id="diaInput" placeholder="--">
      </div>
      <div class="input-box">
        <label>PULSE</label>
        <input type="number" id="pulInput" placeholder="--">
      </div>
    </div>
    <div class="debug-text" id="rawOcrText"></div>
  </div>

  <!-- Medication Log -->
  <div class="card">
    <div class="row-between">
      <div>
        <div class="label">Medication Log</div>
        <div id="medTimeDisplay" style="font-weight:600; margin-top:2px; font-size:14px;">Not recorded yet</div>
      </div>
      <button class="btn-pill" onclick="logMedNow()">💊 Took Now</button>
    </div>
  </div>

  <!-- Save Button -->
  <button class="btn-primary" id="saveBtn" onclick="saveToSheets()">Save to Google Sheets</button>
</div>

<!-- Offscreen canvas for cropping and contrast filter -->
<canvas id="cropCanvas" style="display:none;"></canvas>

<script>
  // Paste your Apps Script URL here
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwTMQrxLQvs6hNiSySp5j2YlGrL2QEdAsLhDzsKMlMFHdktyEGRXXzm9wwfr1K45YMrzw/exec";

  const video = document.getElementById('video');
  const cropCanvas = document.getElementById('cropCanvas');
  const statusMsg = document.getElementById('statusMessage');
  const rawTextElem = document.getElementById('rawOcrText');
  let medicationTimestamp = "";

  // Start back camera
  navigator.mediaDevices.getUserMedia({
    video: {
      facingMode: { ideal: "environment" },
      width: { ideal: 1280 },
      height: { ideal: 720 }
    },
    audio: false
  }).then(stream => {
    video.srcObject = stream;
  }).catch(err => {
    statusMsg.innerText = "Camera access denied: " + err.message;
  });

  function logMedNow() {
    const now = new Date();
    medicationTimestamp = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    document.getElementById('medTimeDisplay').innerText = `Logged at ${medicationTimestamp}`;
  }

  async function captureAndOCR() {
    if (!video.videoWidth || !video.videoHeight) {
      statusMsg.innerText = "Waiting for camera to stabilize...";
      return;
    }

    statusMsg.innerText = "Cropping display & enhancing digits...";
    document.getElementById('scanBtn').disabled = true;

    // 1. Crop only the center dashed box area
    const vW = video.videoWidth;
    const vH = video.videoHeight;
    const cropWidth = Math.floor(vW * 0.80);
    const cropHeight = Math.floor(vH * 0.65);
    const startX = Math.floor((vW - cropWidth) / 2);
    const startY = Math.floor((vH - cropHeight) / 2);

    cropCanvas.width = cropWidth;
    cropCanvas.height = cropHeight;
    const ctx = cropCanvas.getContext('2d');

    // Draw the cropped target area
    ctx.drawImage(video, startX, startY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);

    // 2. High-contrast threshold filter for digital LCD segments
    const imgData = ctx.getImageData(0, 0, cropWidth, cropHeight);
    const d = imgData.data;
    for (let i = 0; i < d.length; i += 4) {
      // Greyscale conversion
      const brightness = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      // Adaptive threshold: separate dark digits from lighter LCD background
      const val = brightness > 120 ? 255 : 0;
      d[i] = val;
      d[i + 1] = val;
      d[i + 2] = val;
    }
    ctx.putImageData(imgData, 0, 0);

    // 3. Run OCR on clean high-contrast image
    try {
      statusMsg.innerText = "Reading numbers...";
      const worker = await Tesseract.createWorker('eng');
      
      // Look strictly for numbers and standard monitor keywords
      await worker.setParameters({
        tessedit_char_whitelist: '0123456789/ \nSYSDIAPUL',
      });

      const { data: { text } } = await worker.recognize(cropCanvas);
      await worker.terminate();

      rawTextElem.innerText = "Detected raw text: " + text.replace(/\n+/g, ' ').trim();
      const found = parseExtractedText(text);

      if (found) {
        statusMsg.innerText = "Numbers detected! Verify or edit before saving.";
        document.getElementById('ocrBadge').style.display = 'inline';
      } else {
        statusMsg.innerText = "Could not cleanly isolate 2 numbers. Tap boxes to type manually, or re-scan.";
      }
    } catch (err) {
      statusMsg.innerText = "Scan failed: " + err.message;
    } finally {
      document.getElementById('scanBtn').disabled = false;
    }
  }

  function parseExtractedText(raw) {
    let clean = raw.replace(/[OODo]/g, '0').replace(/[Il|!]/g, '1');

    // Look for numbers between 35 and 260 (covers human BP and pulse ranges)
    const matches = clean.match(/\b\d{2,3}\b/g) || [];
    const validNumbers = matches
      .map(n => parseInt(n, 10))
      .filter(n => n >= 35 && n <= 260);

    if (validNumbers.length >= 2) {
      // Order: Systolic (highest), Diastolic (lower), Pulse (third)
      const sortedByPos = [...validNumbers];
      
      let sys = sortedByPos[0];
      let dia = sortedByPos[1];
      let pul = sortedByPos[2] || "";

      // Sanity check: Systolic is virtually always higher than Diastolic
      if (sys < dia) {
        const temp = sys;
        sys = dia;
        dia = temp;
      }

      document.getElementById('sysInput').value = sys;
      document.getElementById('diaInput').value = dia;
      document.getElementById('pulInput').value = pul;
      return true;
    }
    return false;
  }

  async function saveToSheets() {
    const sys = document.getElementById('sysInput').value;
    const dia = document.getElementById('diaInput').value;
    const pul = document.getElementById('pulInput').value;

    if (!sys || !dia) {
      alert("Please ensure both SYS and DIA values are filled in.");
      return;
    }

    statusMsg.innerText = "Saving to Google Sheets...";
    document.getElementById('saveBtn').disabled = true;

    const payload = {
      timestamp: new Date().toLocaleString(),
      systolic: sys,
      diastolic: dia,
      pulse: pul || "",
      medicationTime: medicationTimestamp || "Not logged"
    };

    try {
      await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      statusMsg.innerText = "Saved successfully to your sheet!";
      document.getElementById('sysInput').value = "";
      document.getElementById('diaInput').value = "";
      document.getElementById('pulInput').value = "";
      document.getElementById('ocrBadge').style.display = 'none';
      rawTextElem.innerText = "";
      alert("Reading added to Google Sheets!");
    } catch (e) {
      statusMsg.innerText = "Error submitting: " + e.message;
    } finally {
      document.getElementById('saveBtn').disabled = false;
    }
  }
</script>
</body>
</html>
