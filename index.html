<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BP & Pill Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, system-ui, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 12px; display: flex; justify-content: center; }
    .app { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; }

    /* Video Frame */
    .cam-box { position: relative; width: 100%; height: 210px; border-radius: 12px; overflow: hidden; background: #000; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .guide {
      position: absolute; top: 15%; left: 10%; width: 80%; height: 70%;
      border: 2px solid #38bdf8; border-radius: 8px; pointer-events: none;
      display: flex; align-items: flex-end; justify-content: center; padding-bottom: 4px;
      background: rgba(56, 189, 248, 0.08);
    }
    .guide span { font-size: 11px; color: #fff; background: rgba(0,0,0,0.6); padding: 2px 6px; border-radius: 4px; }

    /* Buttons */
    button { border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .btn-scan { background: #334155; color: #f8fafc; padding: 12px; font-size: 14px; width: 100%; }
    .btn-pill { background: #0284c7; color: #fff; padding: 8px 12px; font-size: 12px; border-radius: 20px; }
    .btn-save { background: #10b981; color: #fff; padding: 14px; font-size: 16px; width: 100%; }

    /* Cards & Compact Grid */
    .card { background: #1e293b; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .row { display: flex; justify-content: space-between; align-items: center; }
    .title { font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; }

    .grid { display: flex; gap: 8px; width: 100%; }
    .field { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; text-align: center; }
    .field label { font-size: 11px; font-weight: bold; color: #94a3b8; }
    .field input {
      width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 6px;
      color: #38bdf8; font-size: 20px; font-weight: bold; text-align: center; padding: 8px 0;
    }

    #status { font-size: 12px; text-align: center; color: #cbd5e1; min-height: 18px; }
  </style>
</head>
<body>

<div class="app">
  <!-- Camera Box -->
  <div class="cam-box">
    <video id="v" playsinline autoplay muted></video>
    <div class="guide"><span>Position numbers inside</span></div>
  </div>

  <button type="button" class="btn-scan" onclick="readScreen()">📸 Scan Display</button>
  <div id="status">Point at your BP monitor and tap Scan.</div>

  <!-- Validated Reading -->
  <div class="card">
    <div class="row">
      <span class="title">Verify Numbers (Tap to Edit)</span>
    </div>
    <div class="grid">
      <div class="field">
        <label>SYS</label>
        <input type="number" id="sys" placeholder="--">
      </div>
      <div class="field">
        <label>DIA</label>
        <input type="number" id="dia" placeholder="--">
      </div>
      <div class="field">
        <label>PULSE</label>
        <input type="number" id="pul" placeholder="--">
      </div>
    </div>
  </div>

  <!-- Tablet Tracker -->
  <div class="card">
    <div class="row">
      <div>
        <div class="title">Tablet Time</div>
        <div id="medTxt" style="font-size: 14px; font-weight: 600; margin-top: 2px;">Not taken yet</div>
      </div>
      <button type="button" class="btn-pill" onclick="takeTablet()">💊 Took Tablet Now</button>
    </div>
  </div>

  <!-- Save -->
  <button type="button" class="btn-save" id="saveBtn" onclick="sendToSheet()">Save to Google Sheets</button>
</div>

<!-- Hidden Canvas for frame processing -->
<canvas id="c" style="display:none;"></canvas>

<script>
  // 1. REPLACE WITH YOUR DEPLOYED APPS SCRIPT URL:
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwTMQrxLQvs6hNiSySp5j2YlGrL2QEdAsLhDzsKMlMFHdktyEGRXXzm9wwfr1K45YMrzw/exec";

  let medTakenTime = "";
  const v = document.getElementById('v');
  const c = document.getElementById('c');
  const stat = document.getElementById('status');

  // Launch rear camera
  navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } },
    audio: false
  }).then(s => v.srcObject = s).catch(e => stat.innerText = "Camera error: " + e.message);

  function takeTablet() {
    medTakenTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    document.getElementById('medTxt').innerText = "Logged: " + medTakenTime;
  }

  // Scan function using native system TextDetector if present, or fast multi-pass parsing
  async function readScreen() {
    stat.innerText = "Scanning monitor...";
    
    c.width = v.videoWidth || 640;
    c.height = v.videoHeight || 480;
    const ctx = c.getContext('2d');
    ctx.drawImage(v, 0, 0);

    // Use native mobile OCR if available (built into Android Chrome & iOS Safari)
    if ('TextDetector' in window) {
      try {
        const detector = new window.TextDetector();
        const detected = await detector.detect(c);
        const raw = detected.map(d => d.rawValue).join(' ');
        parseNumbers(raw);
        return;
      } catch (err) {
        // Fall back below if detector fails
      }
    }

    // Dynamic fallback: Load CDN worker with segment-aware whitelist
    if (!window.Tesseract) {
      const script = document.createElement('script');
      script.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
      document.head.appendChild(script);
      await new Promise(res => script.onload = res);
    }

    try {
      const worker = await Tesseract.createWorker('eng');
      await worker.setParameters({
        tessedit_char_whitelist: '0123456789 ',
        tessedit_pageseg_mode: '6' // Assume single uniform block of text
      });
      const { data: { text } } = await worker.recognize(c);
      await worker.terminate();

      parseNumbers(text);
    } catch (e) {
      stat.innerText = "Could not scan automatically. Please enter numbers manually.";
    }
  }

  function parseNumbers(str) {
    // Extract any 2 or 3 digit numbers
    const nums = (str.match(/\b\d{2,3}\b/g) || []).map(Number).filter(n => n >= 35 && n <= 250);
    
    if (nums.length >= 2) {
      let sys = Math.max(nums[0], nums[1]);
      let dia = Math.min(nums[0], nums[1]);
      let pul = nums[2] || "";

      document.getElementById('sys').value = sys;
      document.getElementById('dia').value = dia;
      document.getElementById('pul').value = pul;
      stat.innerText = "Values filled! Verify them before saving.";
    } else {
      stat.innerText = "Digits were blurry or unread. Please type them in directly.";
    }
  }

  // Reliable, CORS-free transmission to Google Sheets
  function sendToSheet() {
    const sys = document.getElementById('sys').value;
    const dia = document.getElementById('dia').value;
    const pul = document.getElementById('pul').value;

    if (!sys || !dia) {
      alert("Please enter both Systolic and Diastolic numbers.");
      return;
    }

    stat.innerText = "Sending to Google Sheets...";
    document.getElementById('saveBtn').disabled = true;

    // Use URLSearchParams + standard POST form format (Google Apps Script always accepts this)
    const formData = new URLSearchParams();
    formData.append("timestamp", new Date().toLocaleString());
    formData.append("systolic", sys);
    formData.append("diastolic", dia);
    formData.append("pulse", pul);
    formData.append("medicationTime", medTakenTime || "Not logged");

    fetch(SCRIPT_URL, {
      method: "POST",
      body: formData
    })
    .then(() => {
      stat.innerText = "Successfully written to Google Sheets!";
      document.getElementById('sys').value = "";
      document.getElementById('dia').value = "";
      document.getElementById('pul').value = "";
      alert("Row added to your Google Sheet!");
    })
    .catch(err => {
      stat.innerText = "Error saving: " + err.message;
    })
    .finally(() => {
      document.getElementById('saveBtn').disabled = false;
    });
  }
</script>
</body>
</html>
